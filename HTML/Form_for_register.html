<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
    </head>
    <body>

        <form action="index.php" method="POST" enctype="multipart/form-data">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your Username" minlength="6" maxlength="30" required><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your Password" minlength="8" maxlength="100" required>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email" required>
            <br>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="18" max="80" required>
            <br>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            <br>

            <label for="b-day">Birthday</label>
            <input type="date" id="b-day" name="b-day" required>
            <br>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="0" max="99" value="1" required>
            <br>

            <label for="title">Title:</label>
            <select id="title" name="title" required>
                <option value="">Select Title</option>
                <option value="mr">Mr.</option>
                <option value="ms">Ms.</option>
                <option value="mrs">Mrs.</option>
                <option value="dr">Dr.</option>
                <option value="prof">Prof.</option>
                <option value="phd">PhD.</option>
            </select><br>

            <label for="title">Title:</label>
            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="title">

            <label for="Ms.">Ms.</label>
            <input type="radio" id="Ms." value="Ms." name="title">

            <label for="Dr.">Dr.</label>
            <input type="radio" id="Dr." value="Dr." name="title">

            <label for="PhD.">PhD.</label>
            <input type="radio" id="PhD." value="PhD." name="title"><br> 
            
            <label for="Payment">Payment Method</label>
            <select id="Payment" name="Payment" required>
                <option value="">Select Payment Method</option>
                <option value="credit">Credit Card</option>
                <option value="debit">Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="visa">Visa</option>
                <option value="mastercard">MasterCard</option>
                <option value="amex">American Express</option>
                <option value="giftcard">Gift Card</option>
            </select><br>

            <label for="subscribe">Subscribe</label>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes"><br>

            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" rows="4" cols="50"></textarea><br>

            <label for="file">Upload File</label>
            <input type="file" id="file" name="file" accept="image/png, image/jpeg"><br>

            <input type="reset" value="Reset">
            <input type="submit" value="Submit">

        </form>

    </body>
</html>
