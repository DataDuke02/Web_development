<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="display_style.css">
        <title>Displays</title>
    </head>
    <body>
        <!--
            display = property specifies if/how
                      an element is displayed
            Block-level = Start on new line, take up the full width available
                          (h1, div, p, form, footer)
            inline = do not start on a new line, width is limited to what is needed
                     (span, a, img)
        -->

        <div>div</div>
        <span>span</span>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Libero, distinctio consectetur voluptatibus consequuntur quaerat asperiores neque corporis quas minima sequi laudantium modi natus delectus aut quia consequatur. Vero, libero voluptas?</p>
    </body>
</html>
