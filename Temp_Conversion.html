<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IEedge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="Temp_Conversion_Style.css">
        <title>TEMPERATURE CONVERSION PROGRAM</title>
    </head>
    <body>
        <form>
            <h1>Temperature Conversion :</h1>
            <input type="number" id="textBox" value="0">

            <input type="radio" id="toFahrenheit" name="unit">
            <label for="toFahrenheit">Celsius ➡️ Fahrenheit</label><br>

            <input type="radio" id="toCelsius" name="unit">
            <label for="toCelsius">Fahrenheit ➡️ Celsius</label><br>

            <button type="button" onclick="convert()">Submit</button>

            <p id="result"></p>
        </form>

		<script src="Temp_Conversion.js"></script>
    </body>
</html>
